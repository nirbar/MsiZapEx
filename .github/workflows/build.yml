name: MsiZapEx Build
on:
  workflow_dispatch:
    inputs:
      publish_nuget:
        description: 'Publish nuget package?'
        required: true
        default: false
        type: boolean
      publish_release:
        description: 'Publish release?'
        required: true
        default: false
        type: boolean
      version:
        description: 'Build & package version'
        required: true
        default: 0.3.0
        type: string
jobs:
  Build:
    runs-on: windows-latest
    permissions:
      id-token: write  # For nuget.org publish
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: microsoft/setup-msbuild@v2

      - name: Decrypt snk
        run: gpg --quiet --batch --yes --decrypt --passphrase="${{ secrets.GPG_PASSPHRASE }}" --output "${{ github.workspace }}\key.snk" "${{ github.workspace }}\key.snk.gpg"

      - name: Set version
        run: Add-Content -Path $env:GITHUB_ENV -Value "FULL_VERSION=${{ github.event.inputs.version }}.${{ github.run_number }}"

      - name: Build
        run: dotnet build dirs.proj -restore -p:Configuration=Release -p:FullVersion=${{ env.FULL_VERSION }}

      - name: Test
        run: dotnet test build\MsiZapExTest\Release\bin\MsiZapExTest.dll

      - name: Publish artifacts
        uses: actions/upload-artifact@v4.6.1
        with:
          name: MsiZapEx
          path: |
            build/net40/MsiZapEx/Release/bin/*.exe
            build/net40/MsiZapEx/Release/bin/*.dll
    
      # Generate NuGet API key
      - name: NuGet login (OIDC → temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: Nir.Bar

      - name: Publish nuget packages to github and nuget.org
        if: ${{ github.event.inputs.publish_nuget == 'true' }}
        run: |
          dotnet nuget add source --username ${{ github.actor }} --password ${{ secrets.GITHUB_TOKEN }} --store-password-in-clear-text --name github "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"
          dotnet nuget push build\MsiZapEx\Release\bin\MsiZapEx.${{ env.FULL_VERSION }}.nupkg --api-key ${{ secrets.GITHUB_TOKEN }} --source github
          dotnet nuget push build\MsiZapEx\Release\bin\MsiZapEx.${{ env.FULL_VERSION }}.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json

      - name: Publish release
        uses: softprops/action-gh-release@v2.2.1
        if: ${{ github.event.inputs.publish_release == 'true' }}
        with:
          prerelease: false
          generate_release_notes: true
          tag_name: ${{ env.FULL_VERSION }}
          files: |
            build\MsiZapEx\Release\bin\MsiZapEx.${{ env.FULL_VERSION }}.nupkg
            build/net40/MsiZapEx/Release/bin/MsiZapEx.exe
            build/net40/MsiZapEx/Release/bin/CommandLine.dll
